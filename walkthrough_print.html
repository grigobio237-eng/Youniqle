# Youniqle — 코드베이스 워크스루

> **Youniqle**은 **회복 중심 건강 & 웰니스 플랫폼**입니다. AI 기반 진단, 사운드/자세 테라피, 임상 상담 워크플로우, 이커머스, 커뮤니티, 파트너(클리닉/샵) 포탈, 관리자 백오피스를 통합한 종합 생태계입니다. **Next.js 14+ App Router** 기반으로 TypeScript, MongoDB(Mongoose), Firebase Storage, NextAuth, Gemini AI, Python 비디오 렌더링 엔진으로 구성됩니다.

---

|---|---|
| **프레임워크** | Next.js 14+ (App Router, src/app/) |
| **언어** | TypeScript (.tsx / .ts) |
| **스타일링** | Tailwind CSS + 커스텀 디자인 토큰 (globals.css) |
| **UI 라이브러리** | shadcn/ui 기반 커스텀 컴포넌트 (src/components/ui/) |
| **상태관리** | React Context (RecoveryContext), React Hooks |
| **인증** | NextAuth.js (이메일 + 소셜: 네이버, 구글, 카카오) |
| **데이터베이스** | MongoDB via Mongoose (70개 이상 모델, src/models/) |

| **파일 저장소** | Firebase Storage (src/lib/utils/firebase-storage.ts) |

| **분석** | 커스텀 분석 이벤트 + 코호트/퍼널/LTV/예측 모델 |

## 3. 핵심 애플리케이션 모듈

### 3.1 진단 시스템 🩺

다단계 자가 진단 엔진:

| 단계 | 파일 | 질문 수 | 카테고리 |
|---|---|---|---|
| **간편 (16문항)** | diagnosis/page.tsx | 16문항 인라인 | 신체, 정신, 생활습관, 수면 |
| **무료 (24문항)** | diagnosis-questions.ts | 10세트 × 24문항 | 사고, 감정, 사회, 신체 |
| **전체 (60문항)** | full-diagnosis-questions.ts | IPIP-NEO Big Five 적응형 | N, E, O, A, C (하위 요인 포함) |
| **IPIP-60** | ipip60-questions.ts | 표준 IPIP-60 | 위와 동일 |

**데이터 흐름:**
1. 사용자가 진단 페이지에서 질문에 응답
2. 카테고리별 점수 계산 (정방향/역방향 채점)
3. 결과를 /api/diagnosis로 POST → MongoDB에 Diagnosis 모델로 저장
4. 결과 페이지에서 카테고리별 점수, 등급 (ECHO/NAVIGATOR/GATE/RESET), 추천 행동 표시
5. 상품 및 회복 추천 연결

**채점 엔진:** simcheung-diagnosis.ts, ipip60-engine.ts

### 3.2 AI 엔진 (Gemini) 🤖

gemini-engine.ts (110 KB)가 중앙 AI 엔진으로 다음 기능을 제공합니다:

- **라이프 스냅 분석** — 사진 기반 회복 분석 (/api/ai/life-snap)
- **증상 분석** — 시술 전 증상 분류 (/api/ai/analyze-symptom)
- **AI 조언** — 개인화된 회복 조언 (/api/ai/advice)
- **AI 네비게이터** — 대화형 컨시어지
- **웹툰 생성** — AI 생성 회복 웹툰
- **상품 설명** — 자동 생성 상품 카피
- **뉴스레터 콘텐츠** — AI 지원 뉴스레터 작성
- **자동화 규칙** — 지능형 워크플로우 트리거
- **AB 테스트 분석** — 실험 통계 분석

**Mock 엔진** mock-engine.ts는 개발용 폴백 응답을 제공합니다.

### 3.3 HeroScanner (홈 페이지 핵심) 📸

HeroScanner.tsx는 랜딩 페이지의 메인 인터랙티브 컴포넌트입니다:

1. **대기** → 카메라 아이콘 + "Life Snap" CTA
2. **유형 선택** → 스냅 카테고리 선택 (식사, 피부, 수면, 활동 등)
3. **촬영** → 웹캠(데스크톱) 또는 파일 업로드(모바일)
4. **스캐닝** → Gemini 분석 중 AI 진행 오버레이 표시
5. **결과** → 점수(0-100), 영양/회복 분석 테이블, 향후 방향
6. **여정 선택** → 웰니스 vs. 클리니컬 경로 선택기
7. **CTA** → "60초 정밀 진단 시작하기" 버튼

### 3.4 임상 상담 워크플로우 🏥

두 개의 멀티스텝 폼이 임상 상담을 처리합니다:

#### PreProcedureForm (5단계)
PreProcedureForm.tsx
- **0단계:** AI 증상 분석기 또는 수동 카테고리 선택 (정형외과, 성형외과, 내과, 일반)
- **1단계:** 기대 회복 수준, 다운타임, 중요 일정
- **2단계:** 과거 치료 이력, 복용 약물, 건강 상태
- **3단계:** 불안 요소 (다중 선택), 프라이버시 우려
- **4단계:** 방문 준비 (동반자, 교통수단)
- **5단계:** 예산 범위, 프리미엄 서비스
- 의료 카테고리에 따라 콘텐츠가 **적응형**으로 변경 (다른 라벨/옵션)

#### PostCareForm (3단계)
PostCareForm.tsx
- **1단계:** 시술명과 날짜
- **2단계:** 증상 수준 (통증, 부기, 멍, 발열 — 1~5점 척도)
- **3단계:** 우려 사항 (느린 회복, 비대칭, 부작용) + 생활습관
- /api/post-care로 제출 → 회복 로드맵 생성
